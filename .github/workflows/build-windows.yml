name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all syhwp --icon=app.ico --add-data "app.ico;." --add-data "app_icon_16.png;." --add-data "app_icon_32.png;." --add-data "app_icon_48.png;." --add-data "app_icon_64.png;." --name 문서_중복_유사성_검사기 main.py


      - name: Verify EXE icon resource
        shell: python
        run: |
          import pefile, sys
          exe = r"dist\문서_중복_유사성_검사기.exe"
          pe = pefile.PE(exe)
          types = set()
          for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries:
              if entry.id is not None:
                  types.add(entry.id)
          # Windows: RT_ICON=3, RT_GROUP_ICON=14
          if 3 not in types or 14 not in types:
              raise SystemExit(f"Icon resource missing: {sorted(types)}")
          print("EXE icon resources verified:", sorted(types))

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 문서_중복_유사성_검사기_Windows
          path: dist/문서_중복_유사성_검사기.exe
