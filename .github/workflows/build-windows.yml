name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all syhwp --name Document_Backup_Finder main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Document_Backup_Finder_Windows
          path: dist/Document_Backup_Finder.exe
