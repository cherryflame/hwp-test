name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all syhwp --icon app.ico --add-data "app.ico;." --name 문서_중복_유사성_검사기 main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 문서_중복_유사성_검사기_Windows
          path: dist/문서_중복_유사성_검사기.exe
